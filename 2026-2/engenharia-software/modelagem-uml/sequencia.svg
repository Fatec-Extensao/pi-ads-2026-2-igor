<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1200" viewBox="0 0 1100 1200" role="img" aria-label="sequencia — proposta para revisão"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#334155"/></marker><marker id="diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1,6 L8,1 L15,6 L8,11 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:16px}.title{font-size:25px;font-weight:bold}.box{fill:#eff6ff;stroke:#334155;stroke-width:1.5}line,path{stroke:#334155;stroke-width:1.5} .small{font-size:14px}</style><rect width="1100" height="1200" fill="white"/><text x="35" y="40" class="title">Sequência — UC02 Responder questionário</text><rect class="box" x="25" y="65" width="170" height="45"/><text x="45" y="94">Respondente</text><line x1="110" y1="110" x2="110" y2="1110" stroke-dasharray="6 6"/><rect class="box" x="265" y="65" width="170" height="45"/><text x="285" y="94">Interface</text><line x1="350" y1="110" x2="350" y2="1110" stroke-dasharray="6 6"/><rect class="box" x="565" y="65" width="170" height="45"/><text x="585" y="94">Serviço</text><line x1="650" y1="110" x2="650" y2="1110" stroke-dasharray="6 6"/><rect class="box" x="865" y="65" width="170" height="45"/><text x="885" y="94">Repositório</text><line x1="950" y1="110" x2="950" y2="1110" stroke-dasharray="6 6"/><line x1="110" y1="160" x2="350" y2="160"  marker-end="url(#arrow)"/><text x="122" y="150" class="small">Solicitar acesso</text><line x1="350" y1="210" x2="650" y2="210"  marker-end="url(#arrow)"/><text x="362" y="200" class="small">Validar credencial</text><rect x="240" y="240" width="800" height="820" fill="none" stroke="#334155"/><text x="250" y="265">alt [acesso inválido]</text><line x1="650" y1="310" x2="350" y2="310" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="362" y="300" class="small">Erro de acesso</text><line x1="240" y1="340" x2="1040" y2="340" stroke-dasharray="6 5"/><text x="250" y="370">[acesso válido]</text><line x1="650" y1="420" x2="350" y2="420" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="362" y="410" class="small">Questionário</text><line x1="110" y1="480" x2="350" y2="480"  marker-end="url(#arrow)"/><text x="122" y="470" class="small">Preencher e revisar</text><line x1="350" y1="540" x2="650" y2="540"  marker-end="url(#arrow)"/><text x="362" y="530" class="small">Finalizar respostas; autorização transitória</text><rect x="275" y="570" width="745" height="465" fill="none" stroke="#334155"/><text x="285" y="595">alt [acesso, pesquisa ou respostas inválidos]</text><line x1="650" y1="640" x2="350" y2="640" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="362" y="630" class="small">Erro; nenhuma gravação</text><line x1="275" y1="670" x2="1020" y2="670" stroke-dasharray="6 5"/><text x="285" y="700">[validação aceita]</text><line x1="650" y1="755" x2="950" y2="755"  marker-end="url(#arrow)"/><text x="662" y="745" class="small">Gravar conjunto anônimo em transação</text><rect x="305" y="785" width="695" height="230" fill="none" stroke="#334155"/><text x="315" y="810">alt [commit confirmado]</text><line x1="950" y1="850" x2="650" y2="850" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="662" y="840" class="small">Sucesso</text><line x1="650" y1="895" x2="350" y2="895" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="362" y="885" class="small">Confirmar conclusão</text><line x1="305" y1="915" x2="1000" y2="915" stroke-dasharray="6 5"/><text x="315" y="940">[falha: rollback]</text><line x1="950" y1="975" x2="650" y2="975" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="662" y="965" class="small">Erro de persistência</text><line x1="650" y1="1005" x2="350" y2="1005" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="362" y="995" class="small">Falha; não confirmar conclusão</text><text x="50" y="1155">Serviço revalida acesso e integridade antes de gravar. Credenciais não entram nas respostas.</text></svg>