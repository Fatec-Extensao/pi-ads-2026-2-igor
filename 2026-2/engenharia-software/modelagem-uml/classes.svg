<text x="50" y="780">Losango: composição. Demais linhas: associação. Multiplicidades junto às extremidades.</text>
<text x="50" y="815">Resposta pertence à questão e à submissão da mesma pesquisa; opção pertence à questão.</text>
<text x="50" y="850">Sem vínculo nominal com Submissao/Resposta. Modelo físico e políticas ainda pendentes.</text></svg>